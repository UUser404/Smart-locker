<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <g id="02 - Penanganan Locker 02">
    <rect id="Background" width="360" height="800" fill="#F5F7FA"/>

    <g id="Status Bar">
      <text x="20" y="19" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">10:07</text>
      <rect x="322" y="11" width="18" height="9" rx="2" stroke="#0F172A"/>
      <rect x="324" y="13" width="12" height="5" rx="1" fill="#0F172A"/>
    </g>

    <g id="App Bar">
      <circle cx="36" cy="56" r="18" fill="#E2E8F0"/>
      <path d="M41 56H31M36 51L31 56L36 61" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="62" font-family="Inter, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Penanganan Locker 02</text>
    </g>

    <g id="Hero - Timer Pintu Terbuka">
      <rect x="16.5" y="96.5" width="327" height="103" rx="18" fill="#FFF7ED" stroke="#FED7AA"/>
      <text x="32" y="122" font-family="Inter, Roboto, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" fill="#C2410C">PINTU TERBUKA</text>
      <text x="32" y="166" font-family="Inter, Roboto, Arial, sans-serif" font-size="40" font-weight="800" fill="#9A3412">06:12</text>
      <text x="32" y="188" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" fill="#78716C">Sejak 10:05 WIB · batas 2 menit</text>
      <rect x="236" y="110" width="92" height="24" rx="12" fill="#FEE2E2"/>
      <text x="282" y="126" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">Lewat batas</text>
      <rect x="290" y="146" width="36" height="44" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
      <circle cx="319" cy="168" r="2.5" fill="#EA580C"/>
    </g>

    <g id="Card - Sensor Pintu">
      <rect x="16.5" y="212.5" width="327" height="63" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="32" y="240" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Sensor pintu</text>
      <text x="32" y="258" font-family="Inter, Roboto, Arial, sans-serif" font-size="11" fill="#64748B">Diperbarui 2 detik lalu</text>
      <rect x="226" y="232" width="102" height="28" rx="14" fill="#FEE2E2"/>
      <circle cx="243" cy="246" r="4" fill="#DC2626"/>
      <text x="253" y="250.5" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#B91C1C">TERBUKA</text>
    </g>

    <g id="Checklist - Langkah Penanganan">
      <text x="16" y="304" font-family="Inter, Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Langkah penanganan</text>
      <text x="344" y="304" text-anchor="end" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">1 dari 3</text>

      <g id="Step 1 - Selesai">
        <rect x="16.5" y="316.5" width="327" height="67" rx="16" fill="#FFFFFF" stroke="#BBF7D0"/>
        <circle cx="46" cy="350" r="14" fill="#16A34A"/>
        <path d="M39 350L44 355L53 345" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="72" y="347" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Cek fisik pintu Locker 02</text>
        <text x="72" y="366" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" fill="#64748B">Pastikan tidak ada yang menghalangi</text>
      </g>

      <g id="Step 2 - Belum">
        <rect x="16.5" y="392.5" width="327" height="67" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
        <circle cx="46" cy="426" r="13" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
        <text x="72" y="423" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Pastikan isi aman atau kosongkan</text>
        <text x="72" y="442" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" fill="#64748B">Jangan ada barang pelanggan tertinggal</text>
      </g>

      <g id="Step 3 - Otomatis">
        <rect x="16.5" y="468.5" width="327" height="67" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="46" cy="502" r="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 3"/>
        <text x="72" y="499" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Tutup rapat pintu locker</text>
        <text x="72" y="518" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" fill="#64748B">Terdeteksi otomatis oleh sensor</text>
        <rect x="262" y="491" width="68" height="22" rx="11" fill="#E2E8F0"/>
        <text x="296" y="506" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748B">OTOMATIS</text>
      </g>
    </g>

    <g id="Info Teknis (collapsed)">
      <rect x="16.5" y="548.5" width="327" height="48" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="34" cy="573" r="4" fill="#16A34A"/>
      <text x="46" y="577" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">ESP32-02 · <tspan font-weight="700" fill="#16A34A">Online</tspan> · Info teknis</text>
      <path d="M318 570L324 576L330 570" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="Sticky Action Bar">
      <rect y="628" width="360" height="172" fill="#FFFFFF"/>
      <line y1="628.5" x2="360" y2="628.5" stroke="#E2E8F0"/>
      <circle cx="30" cy="652" r="8" stroke="#B45309" stroke-width="1.5"/>
      <text x="30" y="656" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#B45309">i</text>
      <text x="46" y="656" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" fill="#B45309">Selesaikan langkah 2 dan tutup pintu dulu</text>

      <g id="Button - Selesaikan (disabled)">
        <rect x="16" y="672" width="328" height="52" rx="14" fill="#E2E8F0"/>
        <text x="180" y="703" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#94A3B8">Selesaikan &amp; Kosongkan Locker</text>
      </g>

      <g id="Button - Kembali">
        <rect x="16.5" y="734.5" width="327" height="44" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="180" y="762" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Kembali</text>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
