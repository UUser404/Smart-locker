<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <g id="03 - Konfirmasi Kosongkan">
    <rect id="Background" width="360" height="800" fill="#F5F7FA"/>

    <g id="Latar Layar Penanganan (dimmed)">
      <circle cx="36" cy="56" r="18" fill="#E2E8F0"/>
      <path d="M41 56H31M36 51L31 56L36 61" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="62" font-family="Inter, Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Penanganan Locker 02</text>

      <rect x="16.5" y="96.5" width="327" height="103" rx="18" fill="#DCFCE7" stroke="#BBF7D0"/>
      <text x="32" y="122" font-family="Inter, Roboto, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" fill="#166534">PINTU TERTUTUP</text>
      <text x="32" y="166" font-family="Inter, Roboto, Arial, sans-serif" font-size="30" font-weight="800" fill="#14532D">Siap diselesaikan</text>

      <rect x="16.5" y="212.5" width="327" height="63" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="32" y="240" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Sensor pintu</text>
      <text x="32" y="258" font-family="Inter, Roboto, Arial, sans-serif" font-size="11" fill="#64748B">Diperbarui 1 detik lalu</text>
      <rect x="226" y="232" width="102" height="28" rx="14" fill="#DCFCE7"/>
      <circle cx="243" cy="246" r="4" fill="#16A34A"/>
      <text x="253" y="250.5" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#166534">TERTUTUP</text>

      <rect x="16.5" y="296.5" width="327" height="60" rx="16" fill="#FFFFFF" stroke="#BBF7D0"/>
      <circle cx="46" cy="326" r="14" fill="#16A34A"/>
      <path d="M39 326L44 331L53 321" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="331" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Cek fisik pintu Locker 02</text>

      <rect x="16.5" y="366.5" width="327" height="60" rx="16" fill="#FFFFFF" stroke="#BBF7D0"/>
      <circle cx="46" cy="396" r="14" fill="#16A34A"/>
      <path d="M39 396L44 401L53 391" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="401" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Pastikan isi aman atau kosongkan</text>
    </g>

    <rect id="Dim Overlay" width="360" height="800" fill="#0F172A" fill-opacity="0.55"/>

    <g id="Bottom Sheet - Konfirmasi">
      <path d="M0 424C0 410 10 400 24 400H336C350 400 360 410 360 424V800H0V424Z" fill="#FFFFFF"/>
      <rect x="160" y="410" width="40" height="4" rx="2" fill="#CBD5E1"/>

      <text x="180" y="448" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Kosongkan Locker 02?</text>
      <text x="180" y="472" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Sesi akan diakhiri dan locker kembali</text>
      <text x="180" y="490" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" fill="#475569">tersedia untuk disewa.</text>

      <g id="Ringkasan Pemeriksaan">
        <rect x="16" y="508" width="328" height="124" rx="16" fill="#F8FAFC"/>

        <circle cx="40" cy="534" r="10" fill="#16A34A"/>
        <path d="M35.5 534L39 537.5L44.5 531" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="538.5" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Pintu locker</text>
        <text x="328" y="538.5" text-anchor="end" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">Tertutup</text>
        <line x1="32" y1="552.5" x2="328" y2="552.5" stroke="#E2E8F0"/>

        <circle cx="40" cy="574" r="10" fill="#16A34A"/>
        <path d="M35.5 574L39 577.5L44.5 571" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="578.5" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Isi locker</text>
        <text x="328" y="578.5" text-anchor="end" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">Sudah dikosongkan</text>
        <line x1="32" y1="592.5" x2="328" y2="592.5" stroke="#E2E8F0"/>

        <circle cx="40" cy="614" r="10" fill="#94A3B8"/>
        <circle cx="40" cy="611" r="3" fill="#FFFFFF"/>
        <path d="M34.5 620C35 616 45 616 45.5 620" fill="#FFFFFF"/>
        <text x="58" y="618.5" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" fill="#475569">Dicatat atas nama</text>
        <text x="328" y="618.5" text-anchor="end" font-family="Inter, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Anda (Petugas)</text>
      </g>

      <g id="Button - Ya Kosongkan">
        <rect x="16" y="650" width="328" height="52" rx="14" fill="#16A34A"/>
        <text x="180" y="681" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Ya, Kosongkan Locker</text>
      </g>

      <g id="Button - Batal">
        <rect x="16.5" y="712.5" width="327" height="48" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="180" y="742" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Batal</text>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
