[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    adafruit/Adafruit GFX Library @ ^1.11.11
    ricmoo/QRCode @ ^0.0.1
build_flags =
    -D CORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<bench_test.cpp> -<tft_raw_test.cpp> -<bench_door.cpp>

[env:bench]
extends = env:esp32dev
build_src_filter = -<*> +<bench_test.cpp> +<tft_render.cpp>

[env:rawtft]
extends = env:esp32dev
build_src_filter = -<*> +<tft_raw_test.cpp>

[env:benchdoor]
   extends = env:esp32dev
   build_src_filter = -<*> +<bench_door.cpp> +<tft_render.cpp> +<door_sensor.cpp>